<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DARKO-BOY</title>
<link rel="icon" href="icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#17141f;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center}
  .boy{
    height:100dvh;width:100%;max-width:480px;margin:0 auto;
    background:linear-gradient(165deg,#4a4458,#332e40 60%,#262231);
    border-radius:0;padding:3dvh 6vw calc(2.4dvh + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:2dvh;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),inset 0 -18px 34px rgba(0,0,0,.45);
  }
  @media(min-width:560px){.boy{border-radius:28px;height:96dvh}}
  .brand{display:flex;justify-content:space-between;align-items:center;color:#cfc8e8}
  .brand b{letter-spacing:.24em;font-size:clamp(15px,4.6vw,20px)}
  .brand .led{width:11px;height:11px;border-radius:50%;background:#ff4757;box-shadow:0 0 9px #ff4757}
  .screen{
    background:#9bbc0f;border-radius:12px 12px 34px 12px;padding:14px 14px 12px;
    box-shadow:inset 0 0 0 4px #6b8f23,inset 0 0 34px rgba(27,42,6,.45);
    color:#1b2a06;min-height:38dvh;display:flex;flex-direction:column;
  }
  .scr-head{font-size:11px;letter-spacing:.18em;border-bottom:2px solid #1b2a06;padding-bottom:6px;display:flex;justify-content:space-between}
  .scr-body{flex:1;padding-top:10px;font-size:clamp(13px,3.8vw,16px);line-height:1.5;overflow:auto}
  .cart-row{padding:9px 8px;border:2px solid transparent;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .cart-row.sel{border-color:#1b2a06;background:rgba(27,42,6,.12)}
  .cart-row.locked{opacity:.45}
  .pix{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:112px;margin:4px 0 10px}
  .pix i{display:block;padding-top:100%}
  .lvl{padding:8px;border:2px solid transparent;cursor:pointer;display:flex;justify-content:space-between}
  .lvl.sel{border-color:#1b2a06;background:rgba(27,42,6,.12)}
  .lvl.locked{opacity:.45}
  .blink{animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .controls{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .dpad{position:relative;width:118px;height:118px}
  .dpad button{position:absolute;background:#1d1a28;border:none;color:#8f88ad;cursor:pointer;font-size:15px;box-shadow:0 4px 0 #0c0a12}
  .dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0c0a12}
  .d-up{top:0;left:39px;width:40px;height:40px;border-radius:7px 7px 0 0}
  .d-down{bottom:0;left:39px;width:40px;height:40px;border-radius:0 0 7px 7px}
  .d-left{left:0;top:39px;width:40px;height:40px;border-radius:7px 0 0 7px}
  .d-right{right:0;top:39px;width:40px;height:40px;border-radius:0 7px 7px 0}
  .d-mid{top:39px;left:39px;width:40px;height:40px;background:#1d1a28}
  .ab{display:flex;gap:14px;transform:rotate(-14deg)}
  .ab button{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-weight:bold;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45)}
  .ab button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
  .btn-a{background:#c2185b}.btn-b{background:#7b1fa2}
  .ab-lab{display:flex;gap:14px;justify-content:space-around;color:#8f88ad;font-size:11px;letter-spacing:.2em;margin-top:6px;transform:rotate(-14deg)}
  .pills{display:flex;gap:18px;justify-content:center}
  .pills button{background:#57506e;border:none;color:#d8d2f0;border-radius:999px;padding:7px 18px;font-family:inherit;letter-spacing:.18em;font-size:11px;cursor:pointer;box-shadow:0 3px 0 #14111d}
  .hint{color:#6f6890;font-size:11px;text-align:center;letter-spacing:.14em}
</style>
</head>
<body>
<div class="boy">
  <div class="brand"><b>DARKO-BOY</b><span style="font-size:11px;letter-spacing:.2em">BATTERY</span><span class="led"></span></div>
  <section class="screen">
    <div class="scr-head"><span id="scrTitle">CARTRIDGE SELECT</span><span id="scrClock">VOL 85</span></div>
    <div class="scr-body" id="scrBody"></div>
  </section>
  <div class="controls">
    <div class="dpad">
      <button class="d-up" id="dUp">&#9650;</button>
      <button class="d-left" id="dLeft">&#9664;</button>
      <div class="d-mid"></div>
      <button class="d-right" id="dRight">&#9654;</button>
      <button class="d-down" id="dDown">&#9660;</button>
    </div>
    <div>
      <div class="ab">
        <button class="btn-b" id="btnB">B</button>
        <button class="btn-a" id="btnA">A</button>
      </div>
      <div class="ab-lab"><span>B</span><span>A</span></div>
    </div>
  </div>
  <div class="pills">
    <button id="btnSelect">SELECT</button>
    <button id="btnStart">START</button>
  </div>
  <div class="hint">D-PAD + A, OR JUST TAP &middot; SONGS PLAY FROM REAL FILES</div>
</div>
<audio id="audio" preload="none"></audio>
<script>
  var CARTS = [
    { title:'FACES', file:'faces.mp3', pal:['#1b2a06','#2f4d0a','#9bbc0f','#dce775','#2f4d0a','#1b2a06','#9bbc0f','#2f4d0a'],
      meta:'EMPIRE &middot; OUT NOV 20, 2026 &middot; ISRC USUYG1845862',
      story:'Irish and Celtic roots. Composed by hand before the drums went on &mdash; a hypnotic draw, Irish Vikings taking another boat&rsquo;s plunder, epic vocals like captivity singing. Folk pull from <i>Sinners</i>, Frank Ticheli and Tchaikovsky underneath.' },
    { title:'A THOUSAND WAYS', file:'a-thousand-ways.mp3', pal:['#2f4d0a','#9bbc0f','#1b2a06','#dce775','#1b2a06','#2f4d0a','#dce775','#9bbc0f'],
      meta:'DISTROKID &middot; SINGLE',
      lyrics:'[VERSE 1]<br>if you had a boat, would you die in the ocean<br>easy to say, but you don&rsquo;t have a boat<br>it&rsquo;s easy to stay when you&rsquo;re already in motion<br>it&rsquo;s harder to do what they say when you&rsquo;re told<br><br>[CHORUS]<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br><br>[VERSE 2]<br>it&rsquo;s easy to live when you&rsquo;ve found your emotion<br>no need to judge, i won&rsquo;t run if you don&rsquo;t<br>sometimes i feel like i&rsquo;m on a rollercoaster<br>sometimes i feel like a burnt piece of toast<br><br>[PRE-CHORUS]<br>easy to give, easy to lie<br>do you have the eyes it takes to stay alive<br>easy as this, simple as pie<br>do you know the odds you will remain alive<br><br>[CHORUS]<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br><br>[VERSE 3]<br>blow me a kiss, like a goodbye<br>it&rsquo;s not the same, just a similar notion<br>if you agree, like what you see<br>send me a sign of your love and devotion<br><br>[BRIDGE]<br>it&rsquo;s easy to sin, it&rsquo;s easy to fly<br>just look at the sun and you can tell the time<br>it&rsquo;s more than a gift, it&rsquo;s more than a light<br>just say what&rsquo;s inside and you&rsquo;ll begin to shine<br><br>[OUTRO]<br>the moment is real, i don&rsquo;t need no more than one<br>because it&rsquo;s more than a thousand ways to stay alive<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br>i said it&rsquo;s easy to live, it&rsquo;s easy to die<br>it&rsquo;s more than a thousand ways to stay alive<br><br><span style="font-size:11px">LYRICS AS PUBLISHED &middot; LIRIKCINTA.COM</span>',
      story:'Groovy alt-pop in a Billie Jean / Nirvana pocket &mdash; funk-tinged indie rock, 90s-alt revival. In rotation: idobi Anthm (42 spins), KX Radio, Sound Frontier FM, flick Radio.' },
    { title:'THE PASSION INSIDE', file:'the-passion-inside.mp3', pal:['#9bbc0f','#dce775','#2f4d0a','#1b2a06','#dce775','#9bbc0f','#1b2a06','#2f4d0a'],
      meta:'EMPIRE &middot; OUT OCT 23, 2026 &middot; CLEAN',
      story:'Built from a Beach Boys record, Red Hot Chili Peppers, and Nirvana&rsquo;s &ldquo;Polly.&rdquo; Regular rotation on KX Radio; added by Shoreditch Radio Nov 2, 2026.' }
  ];
  var audio = document.getElementById('audio');
  var body = document.getElementById('scrBody'), title = document.getElementById('scrTitle');
  var view = 'carts', sel = 0, cartIdx = 0;
  var unlocked = [true,false,false];
  var done = CARTS.map(function(){ return {listen:false, story:false}; });
  var listenedSec = 0, listenTimer = null;

  function pixHTML(pal){
    var h = '<div class="pix">';
    for(var i=0;i<32;i++){ h += '<i style="background:' + pal[(i*7+3)%pal.length] + '"></i>'; }
    return h + '</div>';
  }
  function render(){
    if(view==='carts'){
      title.textContent = 'CARTRIDGE SELECT';
      var h = '<div style="margin-bottom:8px">INSERT CARTRIDGE:</div>';
      CARTS.forEach(function(c,i){
        h += '<div class="cart-row' + (i===sel?' sel':'') + (unlocked[i]?'':' locked') + '" data-i="' + i + '">'
           + '<span>' + (i===sel?'&#9654; ':'') + c.title + '</span><span>' + (unlocked[i] ? (done[i].listen&&done[i].story?'CLEAR!':'IN') : 'LOCKED') + '</span></div>';
      });
      h += '<div style="margin-top:10px;font-size:12px">CLEAR L1 + L3 TO UNLOCK THE NEXT CART.</div>';
      body.innerHTML = h;
      body.querySelectorAll('.cart-row').forEach(function(r){ r.addEventListener('click', function(){ sel=+r.dataset.i; render(); choose(); }); });
    } else if(view==='cart'){
      var c = CARTS[cartIdx];
      title.textContent = c.title;
      var lv = [
        {n:'L1 &middot; LISTEN', s: done[cartIdx].listen?'CLEAR':'PLAY THE SONG', lock:false},
        {n:'L2 &middot; LYRICS', s: c.lyrics?'READ IT':'COMING SOON', lock: !c.lyrics},
        {n:'L3 &middot; THE STORY', s: done[cartIdx].story?'CLEAR':'READ IT', lock:false}
      ];
      var h = pixHTML(c.pal) + '<div style="font-size:12px;margin-bottom:8px">' + c.meta + '</div>';
      lv.forEach(function(l,i){
        h += '<div class="lvl' + (i===sel?' sel':'') + (l.lock?' locked':'') + '" data-i="' + i + '"><span>' + (i===sel?'&#9654; ':'') + l.n + '</span><span>' + l.s + '</span></div>';
      });
      h += '<div id="playState" style="margin-top:8px;font-size:12px">' + (audio.paused?'PRESS A ON L1 TO PLAY':'&#9836; PLAYING&hellip; <span class="blink">&#9612;</span>') + '</div>';
      body.innerHTML = h;
      body.querySelectorAll('.lvl').forEach(function(r){ r.addEventListener('click', function(){ sel=+r.dataset.i; render(); choose(); }); });
    } else if(view==='lyrics'){
      title.textContent = 'L2 &middot; LYRICS';
      body.innerHTML = '<div style="font-size:13px;line-height:1.65">' + CARTS[cartIdx].lyrics + '</div><div style="margin-top:12px;font-size:12px">PRESS B TO GO BACK</div>';
    } else if(view==='story'){
      var c2 = CARTS[cartIdx];
      title.textContent = 'L3 &middot; THE STORY';
      body.innerHTML = '<div style="font-size:14px">' + c2.story + '</div><div style="margin-top:12px;font-size:12px">PRESS B TO GO BACK</div>';
    }
  }
  function startListenTimer(){
    stopListenTimer();
    listenTimer = setInterval(function(){
      if(!audio.paused){ listenedSec++; if(listenedSec>=15){ completeListen(); } }
    },1000);
  }
  function stopListenTimer(){ if(listenTimer){ clearInterval(listenTimer); listenTimer=null; } }
  function completeListen(){
    if(!done[cartIdx].listen){
      done[cartIdx].listen = true; stopListenTimer(); checkUnlock(); render();
    }
  }
  function checkUnlock(){
    for(var i=0;i<CARTS.length-1;i++){
      if(done[i].listen && done[i].story){ unlocked[i+1] = true; }
    }
  }
  function choose(){
    if(view==='carts'){
      if(!unlocked[sel]){ return; }
      cartIdx = sel; sel = 0; view = 'cart'; listenedSec = 0; render();
    } else if(view==='cart'){
      if(sel===0){
        var c = CARTS[cartIdx];
        if(audio.src.indexOf(c.file)===-1){ audio.src = c.file; listenedSec = 0; }
        if(audio.paused){ audio.play(); startListenTimer(); } else { audio.pause(); }
        render();
      } else if(sel===1){
        if(CARTS[cartIdx].lyrics){ view = 'lyrics'; render(); }
        return;
      } else if(sel===2){
        view = 'story'; done[cartIdx].story = true; checkUnlock(); render();
      }
    }
  }
  function back(){
    if(view==='story'){ view='cart'; sel=2; render(); }
    else if(view==='lyrics'){ view='cart'; sel=1; render(); }
    else if(view==='cart'){ audio.pause(); stopListenTimer(); view='carts'; sel=cartIdx; render(); }
  }
  function move(d){
    var max = (view==='carts') ? CARTS.length-1 : 2;
    if(view==='story' || view==='lyrics'){ return; }
    sel = Math.max(0, Math.min(max, sel + d)); render();
  }
  document.getElementById('dUp').addEventListener('click', function(){ move(-1); });
  document.getElementById('dDown').addEventListener('click', function(){ move(1); });
  document.getElementById('dLeft').addEventListener('click', back);
  document.getElementById('dRight').addEventListener('click', choose);
  document.getElementById('btnA').addEventListener('click', choose);
  document.getElementById('btnB').addEventListener('click', back);
  document.getElementById('btnStart').addEventListener('click', choose);
  document.getElementById('btnSelect').addEventListener('click', back);
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowUp'){ move(-1); } else if(e.key==='ArrowDown'){ move(1); }
    else if(e.key==='Enter' || e.key==='a'){ choose(); } else if(e.key==='Escape' || e.key==='b'){ back(); }
  });
  audio.addEventListener('ended', completeListen);
  audio.volume = 0.85;
  render();
</script>
</body>
</html>
